---

- name: Set up NVIDIA container toolkit on Debian-based systems
  block:
    - name: Add NVIDIA libnvidia-container GPG key
      ansible.builtin.apt_key:
        url: "{{ nvidia_docker_repo.gpg_key }}"
        state: present

    - name: Fetch NVIDIA libnvidia-container APT repo file
      ansible.builtin.get_url:
        url: "{{ nvidia_docker_repo.deb_list }}"
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        mode: "0644"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install NVIDIA container toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
  when: ansible_os_family == "Debian"
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
  become: true

- name: Set up NVIDIA container toolkit on RedHat-based systems
  block:
    - name: Import NVIDIA libnvidia-container GPG key
      ansible.builtin.rpm_key:
        key: "{{ nvidia_docker_repo.gpg_key }}"
        state: present

    - name: Fetch NVIDIA libnvidia-container YUM repo file
      ansible.builtin.get_url:
        url: "{{ nvidia_docker_repo.rpm_repo }}"
        dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
        mode: "0644"

    - name: Install NVIDIA container toolkit
      ansible.builtin.yum:
        name: nvidia-container-toolkit
        state: present
  when: ansible_os_family == "RedHat"
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
  become: true

- name: Configure Docker daemon for NVIDIA runtime
  command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_docker_config
  changed_when: nvidia_docker_config.rc == 0 and nvidia_docker_config.stdout is not search('already configured')
  failed_when: nvidia_docker_config.rc != 0
  notify: Restart Docker
  become: true
